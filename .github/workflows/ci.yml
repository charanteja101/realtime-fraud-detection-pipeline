name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fraud:fraud@localhost:5432/fraud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  # Full-stack smoke test: real Redpanda + Postgres + API + processor, synthetic data,
  # duplicates and late events injected. Fails if any event is lost or double-counted.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Generate sample data and train a model
        run: |
          docker compose run --rm tools python -m fraudstream.synth --rows 30000 --out /data/ci_sample.csv
          docker compose run --rm tools python -m fraudstream.train --data /data/ci_sample.csv
      - name: Start stack
        run: docker compose up -d --wait redpanda postgres api processor
      - name: Replay with duplicates and late events
        run: DATA_FILE=ci_sample.csv RATE=0 DUP_RATE=0.02 LATE_RATE=0.02 docker compose run --rm producer
      - name: Verify everything landed exactly once
        run: docker compose run --rm tools python -m fraudstream.report --wait --expect 30000 --timeout 240
      - name: Assert dedupe and late handling were exercised
        run: |
          docker compose exec -T postgres psql -U fraud -d fraud -tA -c \
            "SELECT (SELECT count(*) FROM duplicate_events) > 0 AND (SELECT count(*) FROM transactions WHERE is_late) > 0" \
            | grep -q t
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose --profile replay --profile tools down -v
